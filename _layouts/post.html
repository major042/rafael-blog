---
layout: default
---
<article class="article">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← todos os textos</a>
  <p class="eyebrow">{{ page.date | date: '%d/%m/%Y' }}{% if page.category %} <span class="dot">·</span> {{ page.category }}{% endif %}</p>
  <h1>{{ page.title | escape }}</h1>
  {% if page.description %}<p class="article-intro">{{ page.description | escape }}</p>{% endif %}
  <div class="prose">{{ content }}</div>
  <div class="article-end">✳</div>
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← voltar ao blog</a>
</article>
